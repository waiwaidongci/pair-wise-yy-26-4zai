<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>漏洞披露协作</title><style>body{font:15px system-ui;max-width:1080px;margin:24px auto;padding:0 16px;background:#f4f6f8}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:10px}input,select,textarea,button{padding:7px;margin:3px;border:1px solid #bbb;border-radius:6px}button{background:#7a1f1f;color:#fff}pre{white-space:pre-wrap;max-height:400px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}table{border-collapse:collapse;width:100%;margin-top:8px}th,td{border:1px solid #ddd;padding:6px 8px;text-align:left;vertical-align:top}th{background:#f0eaea}.st{font-weight:700;border-radius:10px;padding:1px 9px;color:#fff;font-size:12px}.st-pass{background:#1d7a36}.st-fail{background:#b3261e}.st-pending{background:#8a6d00}.void{color:#999}.blockbanner{background:#fdecea;border:1px solid #f5c6c2;border-radius:8px;padding:8px 10px;margin:8px 0}.okbanner{background:#e8f5ec;border:1px solid #bfe3c8;border-radius:8px;padding:8px 10px;margin:8px 0}</style><h1>开源漏洞披露协作</h1><section><button onclick="state()">刷新状态</button><pre id="state"></pre></section><section><h2>报告协同</h2><div class="grid"><input id="report" type="number" placeholder="报告 ID"><input id="user" type="number" placeholder="用户 ID"><input id="coord" type="number" placeholder="协调员 ID"><input id="status" placeholder="new/triaged/fixing/resolved"><input id="deadline" value="2026-12-31"><input id="reason" placeholder="延期理由"></div><button onclick="view()">查看可见报告</button><button onclick="setStatus()">更新状态</button><button onclick="extend()">延长保密期</button><button onclick="publish()">按日期披露</button><pre id="result"></pre></section><section><h2>材料与公告</h2><input id="material" placeholder="材料名"><textarea id="content" placeholder="材料或公告内容"></textarea><button onclick="evidence()">添加材料</button><button onclick="advisory()">保存公告草稿</button><button onclick="getAdvisory()">读取公告</button><pre id="extra"></pre></section><section><h2>逐版本修复核对</h2><div>维护者按受影响版本逐条登记处理说明、结果和复测时间；失败或未完成核对时报告留在修复中。摘要、版本或修复计划变更后旧结论作废。</div><div id="fixbanner"></div><div class="grid"><input id="vfversion" placeholder="受影响版本"><input id="vfmaintainer" type="number" placeholder="维护者 ID"><input id="vftime" placeholder="复测时间(可选) YYYY-MM-DD"><input id="vfresult" placeholder="pass / fail"><input id="vfnote" placeholder="处理说明"></div><button onclick="recordFix()">登记 / 再次复测</button><div style="margin-top:10px">变更后重登记：<input id="newsummary" placeholder="新摘要(留空不改)" style="width:340px"><input id="newversions" placeholder="新版本清单,逗号分隔(留空不改)" style="width:300px"><button onclick="revise()">改摘要/版本并作废旧结论</button></div><div id="fixtable"></div></section><script>
const show=(el,x)=>document.querySelector(el).textContent=JSON.stringify(x,null,2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(u,el='#result'){show(el,await(await fetch(u)).json())}
async function post(u,b,el='#result'){show(el,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}
async function state(){show('#state',await(await fetch('/api/state')).json())}
let lastReport=null,lastUser=0;
async function view(){lastUser=+user.value;const r=await(await fetch('/api/reports/'+report.value+'?user_id='+user.value)).json();show('#result',r);if(r&&r.id!==undefined){lastReport=r;renderFixes(r)}}
function setStatus(){post('/api/reports/'+report.value+'/status',{status:status.value,user_id:+coord.value,note:'页面更新'}).then(()=>view())}
function extend(){post('/api/extensions',{report_id:+report.value,new_deadline:deadline.value,reason:reason.value,coordinator_id:+coord.value})}
function publish(){post('/api/reports/'+report.value+'/publish',{coordinator_id:+coord.value,as_of:deadline.value})}
function evidence(){post('/api/evidence',{report_id:+report.value,name:material.value,content:content.value,classification:'private',uploaded_by:+user.value})}
function advisory(){post('/api/advisories',{report_id:+report.value,content:content.value,user_id:+coord.value},'#extra')}
function getAdvisory(){get('/api/reports/'+report.value+'/advisory?user_id='+user.value,'#extra')}
function recordFix(){post('/api/version-fixes',{report_id:+report.value,version:vfversion.value,maintainer_id:+vfmaintainer.value,note:vfnote.value,result:vfresult.value||'pass',tested_at:vftime.value||null},'#extra').then(()=>view())}
function revise(){const body={user_id:+coord.value};if(newsummary.value.trim())body.summary=newsummary.value;if(newversions.value.trim())body.versions=newversions.value.split(',').map(v=>v.trim()).filter(Boolean);post('/api/reports/'+report.value+'/revise',body,'#extra').then(()=>view())}
function renderFixes(r){
 const vf=r.version_fixes;const box=document.querySelector('#fixbanner');
 if(!vf){box.innerHTML='';document.querySelector('#fixtable').innerHTML='';return}
 if(vf.all_passed){box.innerHTML='<div class="okbanner">全部 '+vf.versions.length+' 个受影响版本复测通过（第 '+(vf.revision+1)+' 轮结论），协调员可推进到已解决。</div>'}
 else{const lines=vf.blockers.map(b=>'<b>'+esc(b.version)+'</b>：'+esc(b.reason)).join('<br>');
   box.innerHTML='<div class="blockbanner">报告保持修复中，阻塞项：<br>'+lines+'</div>'}
 const label={pass:'通过',fail:'失败',pending:'待复测'};
 let rows=vf.versions.map(it=>{const lat=it.latest?esc(lat2(it.latest)):'—';
   const voided=it.voided_latest?'<div class="void">旧结论已作废：第 '+(it.voided_latest.revision+1)+' 轮 '+label[it.voided_latest.result]+' '+esc(it.voided_latest.tested_at)+'</div>':'';
   return '<tr><td>'+esc(it.version)+'</td><td><span class="st st-'+it.state+'">'+label[it.state]+'</span></td>'+
   '<td>'+lat+'</td><td>'+(it.blocker?esc(it.blocker):'')+'</td><td>'+voided+'</td></tr>'}).join('');
 document.querySelector('#fixtable').innerHTML='<table><tr><th>版本</th><th>进度</th><th>最近结果</th><th>阻塞项</th><th>历史轮次</th></tr>'+rows+'</table>'+
  '<div class="void">当前为第 '+(vf.revision+1)+' 轮结论（修复计划首次提交为第 1 轮）；再次复测旧记录保留为历史。</div>'}
function lat2(l){return (l.result==='pass'?'通过':'失败')+' · '+l.tested_at+' · '+l.note}
state()
</script></html>
