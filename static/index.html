<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>漏洞披露协作</title><style>body{font:15px system-ui;max-width:1080px;margin:24px auto;padding:0 16px;background:#f4f6f8}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:10px}input,select,textarea,button{padding:7px;margin:3px;border:1px solid #bbb;border-radius:6px}button{background:#7a1f1f;color:#fff}pre{white-space:pre-wrap;max-height:400px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}</style><h1>开源漏洞披露协作</h1><section><button onclick="state()">刷新状态</button><pre id="state"></pre></section><section><h2>报告协同</h2><div class="grid"><input id="report" type="number" placeholder="报告 ID"><input id="user" type="number" placeholder="用户 ID"><input id="coord" type="number" placeholder="协调员 ID"><input id="status" placeholder="new/triaged/fixing/resolved"><input id="deadline" value="2026-12-31"><input id="reason" placeholder="延期理由"></div><button onclick="view()">查看可见报告</button><button onclick="setStatus()">更新状态</button><button onclick="extend()">延长保密期</button><button onclick="publish()">按日期披露</button><pre id="result"></pre></section><section><h2>材料与公告</h2><input id="material" placeholder="材料名"><textarea id="content" placeholder="材料或公告内容"></textarea><button onclick="evidence()">添加材料</button><button onclick="advisory()">保存公告草稿</button><button onclick="getAdvisory()">读取公告</button><pre id="extra"></pre></section><section><h2>逐版本修复核对</h2><div class="grid"><input id="maint" type="number" placeholder="维护者 ID"><input id="vkey" placeholder="版本号"><select id="vresult"><option value="pass">pass 通过</option><option value="fail">fail 失败</option></select><input id="vnote" placeholder="处理说明"><input id="newsummary" placeholder="新摘要(留空不改)"><input id="newversions" placeholder="新版本,逗号分隔(留空不改)"></div><button onclick="addCheck()">登记版本核对</button><button onclick="verify()">查看核对进度</button><button onclick="scope()">修改摘要/版本</button><pre id="verify"></pre></section><script>const show=(el,x)=>document.querySelector(el).textContent=JSON.stringify(x,null,2);async function get(u,el='#result'){show(el,await(await fetch(u)).json())}async function post(u,b,el='#result'){show(el,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}async function state(){show('#state',await(await fetch('/api/state')).json())}function view(){get('/api/reports/'+report.value+'?user_id='+user.value)}function setStatus(){post('/api/reports/'+report.value+'/status',{status:status.value,user_id:+coord.value,note:'页面更新'})}function extend(){post('/api/extensions',{report_id:+report.value,new_deadline:deadline.value,reason:reason.value,coordinator_id:+coord.value})}function publish(){post('/api/reports/'+report.value+'/publish',{coordinator_id:+coord.value,as_of:deadline.value})}function evidence(){post('/api/evidence',{report_id:+report.value,name:material.value,content:content.value,classification:'private',uploaded_by:+user.value})}function advisory(){post('/api/advisories',{report_id:+report.value,content:content.value,user_id:+coord.value},'#extra')}function getAdvisory(){get('/api/reports/'+report.value+'/advisory?user_id='+user.value,'#extra')}async function addCheck(){post('/api/version-checks',{report_id:+report.value,version_key:vkey.value,maintainer_id:+maint.value,note:vnote.value,result:vresult.value},'#verify')}async function verify(){const v=await(await fetch('/api/reports/'+report.value+'/verification?user_id='+user.value)).json();if(v.progress){renderVerify(v)}else{show('#verify',v)}}function renderVerify(v){const lines=v.progress.map(p=>'版本 '+p.version_key+': '+(p.state==='pass'?'通过':p.state==='fail'?'失败':'待复测')+(p.result_at?' — '+p.note+' ('+p.maintainer+', '+p.result_at+')':'')+(p.superseded?' [已作废 '+p.superseded+' 条]':''));lines.push('阻塞项: '+(v.blocking_versions.join('、')||'无'));lines.push('可推进已解决: '+(v.can_resolve?'是':'否'));document.querySelector('#verify').textContent=lines.join('\n')+'\n\n'+JSON.stringify(v,null,2)}function scope(){const b={user_id:+coord.value};if(newsummary.value)b.summary=newsummary.value;if(newversions.value)b.versions=newversions.value.split(',').map(s=>s.trim()).filter(Boolean);post('/api/reports/'+report.value+'/scope',b,'#verify')}state()</script></html>
